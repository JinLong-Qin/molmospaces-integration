<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">MolmoSpaces x MimicGen</title>
  <desc id="desc">Centered banner for the public GitHub README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="320" rx="36" fill="url(#bg)"/>
  <circle cx="160" cy="80" r="88" fill="#60a5fa" fill-opacity="0.16"/>
  <circle cx="1240" cy="62" r="110" fill="#c084fc" fill-opacity="0.14"/>
  <circle cx="1210" cy="256" r="140" fill="#22d3ee" fill-opacity="0.10"/>
  <path d="M0 244 C 180 212, 300 292, 470 252 S 780 172, 980 214 S 1230 292, 1400 228 L 1400 320 L 0 320 Z" fill="#ffffff" fill-opacity="0.07"/>

  <g filter="url(#shadow)">
    <text x="700" y="126" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="800" fill="url(#text)">MolmoSpaces x MimicGen</text>
    <text x="700" y="178" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#e2e8f0">Pick-and-Place trajectory generation · bimanual YAM browser/keyboard teleoperation</text>
    <text x="700" y="220" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">Public research snapshot · install · replay · generate · inspect</text>
  </g>
</svg>
