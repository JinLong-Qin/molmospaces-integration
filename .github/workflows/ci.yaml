name: Core CI/CD checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Log disk space
        run: |
          df -h /

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install UV package manager
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and setup virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate

      - name: Install package
        run: |
          source .venv/bin/activate
          uv pip install --no-cache -e .[dev,mujoco]

      - name: Prepare NLTK resources
        run: |
          source .venv/bin/activate
          export NLTK_DATA="$RUNNER_TEMP/nltk_data"
          echo "NLTK_DATA=$NLTK_DATA" >> "$GITHUB_ENV"
          python -m nltk.downloader -d "$NLTK_DATA" wordnet wordnet2022
          python - <<'PY'
          import nltk

          resources = {
              "wordnet": ("corpora/wordnet", "corpora/wordnet.zip"),
              "wordnet2022": ("corpora/wordnet2022", "corpora/wordnet2022.zip"),
          }
          for name, candidates in resources.items():
              for candidate in candidates:
                  try:
                      path = nltk.data.find(candidate)
                      print(f"NLTK_RESOURCE_OK: {name} -> {path}")
                      break
                  except LookupError:
                      continue
              else:
                  raise RuntimeError(f"NLTK_RESOURCE_MISSING: {name}")
          PY

      - name: Log disk space
        run: |
          df -h /

      - name: Run component tests
        run: |
          source .venv/bin/activate
          python -m pytest mlspaces_tests/component_tests/ -v --tb=short -k "not (SimpleWarp or CrossSolver)"

  ruff-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ruff for formatting and linting
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: "--version"

      - name: Run formatting using ruff
        run: |
          ruff format --check .
